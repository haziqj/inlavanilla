url: http://haziqj.ml/inlavanilla/
# Example output 76 columns wide, so that with "#> " it fits the code box
code:
  width: 76
template:
  bootstrap: 5
  # MathJax, as Quarto uses, rather than pkgdown's default MathML
  math-rendering: mathjax

navbar:
  structure:
    left: [intro, reference, examples, articles, news]
  components:
    # Hand-written, as pkgdown builds only the one articles menu. Keep it in
    # step with the Examples section below.
    examples:
      text: Examples
      menu:
      - text: Multilevel models
        href: articles/multilevel.html
      - text: Cognitive diagnostic models
        href: articles/cdm.html
      - text: Correlation matrices
        href: articles/correlation.html
      - text: Binary factor analysis
        href: articles/binary-cfa.html
      - text: Diagnostic tests without a gold standard
        href: articles/diagnostic-tests.html

articles:
- title: Get started
  contents:
  - inlavanilla
- title: Examples
  contents:
  - articles/multilevel
  - articles/cdm
  - articles/correlation
  - articles/binary-cfa
  - articles/diagnostic-tests
- title: Articles
  navbar: ~
  contents:
  - diagnostics
  - model-comparison
  - articles/rcpp
  - articles/rtmb

redirects:
- ["articles/tmb.html", "articles/rtmb.html"]
- ["articles/dcm.html", "articles/cdm.html"]
