# Checks the copy of the inlavanilla engine in R/vanilla-*.R: the copies match
# inst/inlavanilla.lock, the lock matches its release on GitHub, no name
# clashes, and DESCRIPTION has what the engine needs. A newer release of
# inlavanilla is reported and does not fail the run. Written by
# inlavanilla::use_vanilla_ci().
on:
  push:
    branches: [main, master]
  pull_request:

name: vanilla-status

permissions: read-all

jobs:
  vanilla-status:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install inlavanilla
        shell: Rscript {0}
        run: |
          install.packages("remotes")
          remotes::install_github("haziqj/inlavanilla@*release")

      - name: Check the engine copy
        shell: Rscript {0}
        run: inlavanilla::vanilla_status(error = TRUE)
