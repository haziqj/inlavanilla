# Fast checks of the source tree, without installing R: the code is formatted
# with air (settings in air.toml), and the engine files R/vanilla-*.R hold only
# internal code.
on:
  push:
    branches: [main, master]
  pull_request:

name: source-checks

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install air
        uses: posit-dev/setup-air@v1

      - name: Check formatting
        run: air format . --check

      # The engine files are copied byte for byte into other packages
      # (INLAvaan), so they hold only internal code: no roxygen and no
      # exports, no S3 generics or method registrations, and not the name of
      # this package. Help, exports and methods go in the other files of R/.
      - name: Check the engine files R/vanilla-*.R
        run: |
          status=0
          if grep -n "^[[:space:]]*#'" R/vanilla-*.R; then
            echo "::error::R/vanilla-*.R hold roxygen; document and export from another file"
            status=1
          fi
          if grep -nE '(UseMethod|NextMethod|registerS3method|setGeneric|setMethod)[[:space:]]*\(|S3method' R/vanilla-*.R; then
            echo "::error::R/vanilla-*.R define a generic or register a method"
            status=1
          fi
          # Outside comments, and not as the prefix of a condition class
          # (inlavanilla_error)
          if grep -nE '^[^#]*inlavanilla([^_]|$)' R/vanilla-*.R; then
            echo "::error::R/vanilla-*.R name the package inlavanilla"
            status=1
          fi
          exit $status
